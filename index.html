<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05040c">
<title>Shadow Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>/* шрифты подгружаются фоном: игра стартует сразу, даже если Google Fonts медленный или недоступен */(function(){try{var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap";document.head.appendChild(l);}catch(e){}})();</script>
<style>
/* Визуальная концепция: ночной киберпанк. Фиолетовый — тьма, голубой — человек, розовый — угроза. Рамки со срезанными углами, свечение вместо теней. */
:root {
  --bg: #05040c; --bg2: #0b0919; --panel: rgba(12, 10, 28, .9); --panel2: rgba(24, 19, 50, .92);
  --line: rgba(138, 92, 255, .4); --line2: rgba(56, 214, 255, .4);
  --violet: #8a5cff; --cyan: #38d6ff; --pink: #ff4fd8; --gold: #ffe08a; --green: #5be37d; --red: #ff4a6a;
  --text: #e9e6ff; --dim: #9a96bd; --mute: #6a6690;
  --font: 'Chakra Petch', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace;
  --cut: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  --cut-s: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); outline: none; }
#app canvas { position: absolute; left: 0; top: 0; display: block; }
button { font-family: inherit; }
b, strong { font-weight: 700; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-top: 10px; padding-bottom: 10px; box-sizing: border-box; }
#hud[hidden] { display: none; }
#hud-tl { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 10px; width: min(330px, 56vw); display: flex; flex-direction: column; gap: 8px; }
.plate { display: flex; gap: 8px; align-items: stretch; background: var(--panel); border: 1px solid var(--line); padding: 7px 9px 7px 7px; clip-path: var(--cut-s); }
.lvl { min-width: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(160deg, rgba(138, 92, 255, .35), rgba(56, 214, 255, .15)); border: 1px solid var(--line); line-height: 1; }
.lvl span { font-size: 20px; font-weight: 700; font-family: var(--mono); }
.lvl small { font-size: 9px; letter-spacing: .12em; color: var(--dim); margin-top: 2px; }
.bars { flex: 1; display: flex; flex-direction: column; gap: 4px; justify-content: center; min-width: 0; }
.bar { position: relative; height: 14px; background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 255, 255, .12); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width .12s linear; }
.bar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 10px var(--mono); letter-spacing: .06em; text-shadow: 0 1px 2px #000; }
.bar.hp i { background: linear-gradient(90deg, #ff2a5a, #ff6a8a); box-shadow: 0 0 12px rgba(255, 60, 100, .6); }
.bar.hp.low { animation: pulse .6s infinite alternate; }
.bar.st { height: 7px; } .bar.st i { background: linear-gradient(90deg, #5be37d, #c8ff7a); }
.bar.en { height: 9px; } .bar.en i { background: linear-gradient(90deg, #4a6cff, #38d6ff); box-shadow: 0 0 10px rgba(56, 214, 255, .5); }
.bar.en b { font-size: 8px; }
@keyframes pulse { to { filter: brightness(1.6); } }
#shadow-meter { background: var(--panel); border: 1px solid var(--line); padding: 6px 9px 7px; clip-path: var(--cut-s); }
.sm-head { display: flex; align-items: baseline; gap: 8px; font-size: 11px; letter-spacing: .14em; color: var(--dim); }
.sm-head b { font: 700 14px var(--mono); color: #d9c2ff; letter-spacing: 0; }
.sm-head em { margin-left: auto; font-style: normal; font-size: 10px; letter-spacing: .08em; color: #c8a8ff; text-transform: uppercase; }
.sm-bar { position: relative; height: 8px; margin-top: 4px; background: rgba(0, 0, 0, .6); border: 1px solid rgba(138, 92, 255, .35); }
.sm-bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #5a2cff, #b46cff, #ff4fd8); box-shadow: 0 0 12px rgba(180, 108, 255, .7); transition: width .25s; }
.sm-bar u { position: absolute; top: -2px; bottom: -2px; width: 1px; background: rgba(255, 255, 255, .35); }
#hud-tr { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 10px; width: 176px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
#minimap-wrap { background: var(--panel); border: 1px solid var(--line); padding: 5px; clip-path: var(--cut-s); pointer-events: auto; cursor: pointer; }
#minimap { --mm: 164px; width: var(--mm); height: calc(var(--mm) * 0.8); display: block; }
.zone-line { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; gap: 6px; padding: 0 2px; }
.zone-line b { color: var(--text); font-weight: 600; letter-spacing: .04em; }
#clock { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); padding: 4px 8px; font: 600 11px var(--mono); clip-path: var(--cut-s); }
#clock .sun { width: 12px; height: 12px; border-radius: 50%; background: #ffe08a; box-shadow: 0 0 8px #ffe08a; }
#clock.night .sun { background: #b8c4ff; box-shadow: inset -4px -2px 0 #3a3a7a, 0 0 8px #8a9cff; }
#clock em { margin-left: auto; font-style: normal; font-size: 9px; letter-spacing: .1em; color: var(--dim); }
#clock.night em { color: #ff9ac8; }
#res { display: flex; gap: 4px; }
.chip { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; background: var(--panel); border: 1px solid var(--line); padding: 4px 4px; font: 600 12px var(--mono); clip-path: var(--cut-s); }
.chip svg { width: 13px; height: 13px; flex: none; }
#boss { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: min(560px, 52vw); text-align: center; }
#boss[hidden] { display: none; }
#boss .bn { font-weight: 700; letter-spacing: .24em; font-size: 14px; text-transform: uppercase; text-shadow: 0 0 14px currentColor; }
#boss .bs { font-size: 10px; letter-spacing: .14em; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; }
#boss .bb { position: relative; height: 12px; background: rgba(0, 0, 0, .65); border: 1px solid rgba(255, 255, 255, .25); overflow: hidden; }
#boss .bb i { position: absolute; inset: 0 auto 0 0; width: 100%; background: linear-gradient(90deg, #ff2a5a, #ff7a8a); transition: width .1s linear; box-shadow: 0 0 14px rgba(255, 50, 90, .6); }
#boss .bb u { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, .7); }
#banner { position: absolute; left: 0; right: 0; top: 22%; text-align: center; opacity: 0; pointer-events: none; }
#banner.show { animation: banner 3.2s ease-out forwards; }
#banner h2 { margin: 0; font-size: clamp(24px, 5vw, 46px); letter-spacing: .3em; font-weight: 700; text-transform: uppercase; text-shadow: 0 0 24px currentColor, 0 0 2px #000; padding-left: .3em; }
#banner p { margin: 6px 0 0; font-size: clamp(12px, 2vw, 16px); letter-spacing: .18em; color: #d8d4f0; text-transform: uppercase; text-shadow: 0 1px 8px #000; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.12); letter-spacing: .6em; } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
#subtitle { position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%); max-width: min(720px, 86vw); text-align: center; font-size: 15px; letter-spacing: .03em; padding: 8px 16px; background: rgba(5, 4, 12, .72); border-left: 2px solid currentColor; opacity: 0; transition: opacity .3s; text-shadow: 0 1px 4px #000; }
#subtitle.on { opacity: 1; }
#prompt { position: absolute; left: 50%; bottom: 168px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid var(--line2); padding: 7px 14px; font-size: 14px; clip-path: var(--cut-s); opacity: 0; transition: opacity .15s; pointer-events: none; white-space: nowrap; }
#prompt.on { opacity: 1; pointer-events: auto; cursor: pointer; }
#prompt kbd, kbd { font: 700 12px var(--mono); background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .3); padding: 1px 7px; border-radius: 3px; color: var(--cyan); }
#toasts { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 176px; display: flex; flex-direction: column; gap: 5px; width: min(320px, 60vw); }
.toast { background: rgba(8, 6, 20, .86); border-left: 3px solid var(--violet); padding: 6px 10px; font-size: 13px; animation: toast 3.6s forwards; text-shadow: 0 1px 3px #000; }
@keyframes toast { 0% { opacity: 0; transform: translateX(-14px); } 8% { opacity: 1; transform: none; } 82% { opacity: 1; } 100% { opacity: 0; } }
#tut { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line2); padding: 10px 18px; font-size: 15px; text-align: center; clip-path: var(--cut-s); pointer-events: auto; max-width: min(520px, 80vw); }
#tut[hidden] { display: none; }
#tut small { display: block; color: var(--dim); font-size: 11px; margin-top: 4px; letter-spacing: .08em; }
#tut button { margin-top: 6px; }
#tut b { color: var(--cyan); }
#hud-bl { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; gap: 8px; }
#hud-bc { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: flex-end; }
.slot { position: relative; width: 58px; height: 58px; background: var(--panel); border: 1px solid var(--line); clip-path: var(--cut-s); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.slot img { width: 40px; height: 40px; image-rendering: auto; }
.slot .key { position: absolute; left: 4px; top: 2px; font: 700 10px var(--mono); color: var(--cyan); }
.slot .cd { position: absolute; inset: 0; background: rgba(0, 0, 0, .72); transform-origin: bottom; }
.slot .cdt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 15px var(--mono); text-shadow: 0 0 6px #000; }
.slot .sub { position: absolute; right: 4px; bottom: 2px; font: 600 9px var(--mono); color: var(--dim); }
.slot.empty { opacity: .45; }
.slot.dark { border-color: rgba(180, 108, 255, .8); box-shadow: inset 0 0 14px rgba(138, 92, 255, .35); }
.slot.ready { box-shadow: 0 0 14px rgba(56, 214, 255, .35); }
.slot.big { width: 64px; height: 64px; }
#hud-cons { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 82px; display: flex; gap: 6px; pointer-events: auto; }
#hud-cons .slot { width: 52px; height: 30px; flex-direction: row; gap: 4px; cursor: pointer; }
#hud-cons .slot:hover { border-color: var(--cyan); }
#hud-cons .slot svg { width: 15px; height: 15px; }
#hud-cons .slot b { font: 700 13px var(--mono); }
#hud-cons .slot .key { position: static; margin-right: 1px; }
#hud-cons .slot.empty { opacity: .35; }
#xpbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255, 255, 255, .06); }
#xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb43a, #ffe08a); box-shadow: 0 0 10px rgba(255, 210, 90, .7); }
#hud-menu { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 14px; display: flex; gap: 6px; pointer-events: auto; }
.hbtn { width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line); color: var(--text); cursor: pointer; clip-path: var(--cut-s); padding: 0; position: relative; }
.hbtn:hover { border-color: var(--cyan); color: var(--cyan); }
.hbtn svg { width: 18px; height: 18px; }
.hbtn .badge { position: absolute; right: 2px; top: 1px; font: 700 10px var(--mono); color: #05040c; background: var(--gold); padding: 0 4px; }

/* ---------- Сенсорное управление ---------- */
#touch { position: absolute; inset: 0; pointer-events: none; display: none; visibility: hidden; }
.is-touch #touch { display: block; }
.stick { position: absolute; width: 130px; height: 130px; border-radius: 50%; border: 2px solid rgba(138, 92, 255, .55); background: radial-gradient(circle, rgba(138, 92, 255, .12), rgba(138, 92, 255, .02)); opacity: 0; transition: opacity .15s; }
.stick.on { opacity: 1; }
.stick i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle, rgba(56, 214, 255, .7), rgba(56, 214, 255, .25)); border: 2px solid var(--cyan); }
.tbtn { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: rgba(12, 10, 28, .7); border: 2px solid var(--line); color: var(--text); font: 700 14px var(--font); display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; }
.tbtn.on { background: rgba(56, 214, 255, .3); border-color: var(--cyan); }
.tbtn svg { width: 26px; height: 26px; }
.tbtn.sm { width: 46px; height: 46px; font-size: 12px; }
#tb-dash { right: calc(max(14px, env(safe-area-inset-right, 0px)) + 4px); bottom: 150px; }
#tb-q { right: calc(max(14px, env(safe-area-inset-right, 0px)) + 74px); bottom: 124px; }
#tb-e { right: calc(max(14px, env(safe-area-inset-right, 0px)) + 4px); bottom: 220px; }
#tb-alt { right: calc(max(14px, env(safe-area-inset-right, 0px)) + 80px); bottom: 194px; }
#tb-use { right: calc(max(14px, env(safe-area-inset-right, 0px)) + 150px); bottom: 150px; }

/* ---------- Окна ---------- */
#ui { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: auto; padding: 12px; box-sizing: border-box; }
#ui.open { display: flex; }
#ui.dim { background: radial-gradient(ellipse at center, rgba(5, 4, 14, .72), rgba(2, 1, 8, .94)); backdrop-filter: blur(3px); }
.panel { position: relative; background: var(--panel); border: 1px solid var(--line); clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); max-width: 100%; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 0 60px rgba(138, 92, 255, .2); }
.panel::before { content: ""; position: absolute; left: 0; top: 0; width: 120px; height: 2px; background: linear-gradient(90deg, var(--cyan), transparent); }
.panel > header { display: flex; align-items: center; gap: 12px; padding: 14px 20px 10px; border-bottom: 1px solid rgba(138, 92, 255, .2); }
.panel > header h2 { margin: 0; font-size: 18px; letter-spacing: .22em; text-transform: uppercase; font-weight: 700; }
.panel > header .sp { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 12px; }
.panel > .body { padding: 14px 20px 18px; overflow: auto; min-height: 0; flex: 1; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.panel > footer { padding: 10px 20px 14px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid rgba(138, 92, 255, .15); }
.panel.sm { width: 440px; } .panel.md { width: 760px; } .panel.lg { width: 1020px; } .panel.xl { width: 1180px; height: min(720px, 100%); }
.btn { position: relative; background: linear-gradient(180deg, rgba(138, 92, 255, .22), rgba(138, 92, 255, .08)); border: 1px solid var(--line); color: var(--text); padding: 9px 18px; font: 600 14px var(--font); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; clip-path: var(--cut-s); transition: background .12s, border-color .12s, transform .08s; text-align: center; }
.btn:hover:not(:disabled) { background: linear-gradient(180deg, rgba(56, 214, 255, .28), rgba(138, 92, 255, .14)); border-color: var(--cyan); color: #fff; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled, .btn.dis { opacity: .4; cursor: not-allowed; }
.btn.pri { background: linear-gradient(180deg, rgba(56, 214, 255, .4), rgba(56, 214, 255, .14)); border-color: var(--cyan); }
.btn.dng { border-color: rgba(255, 74, 106, .6); background: linear-gradient(180deg, rgba(255, 74, 106, .25), rgba(255, 74, 106, .08)); }
.btn.sm { padding: 5px 11px; font-size: 12px; }
.btn small { display: block; font-size: 10px; letter-spacing: .06em; color: var(--dim); text-transform: none; font-weight: 500; margin-top: 2px; }
.btn:focus-visible, .cell:focus-visible, .card:focus-visible, .node:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.row { display: flex; gap: 12px; align-items: center; } .row.w { flex-wrap: wrap; } .col { display: flex; flex-direction: column; gap: 10px; }
.dim { color: var(--dim); } .mut { color: var(--mute); } .gold { color: var(--gold); } .cy { color: var(--cyan); } .dk { color: #c8a0ff; } .un { color: var(--gold); display: block; font-style: italic; }
.h3 { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin: 0 0 6px; font-weight: 600; }
.sep { height: 1px; background: rgba(138, 92, 255, .2); margin: 8px 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { padding: 7px 14px; background: transparent; border: 1px solid rgba(138, 92, 255, .25); color: var(--dim); cursor: pointer; font: 600 12px var(--font); letter-spacing: .12em; text-transform: uppercase; clip-path: var(--cut-s); }
.tab.on { color: #fff; border-color: var(--cyan); background: rgba(56, 214, 255, .12); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 2px 0; }
.kv .k { color: var(--dim); } .kv .v { font-family: var(--mono); }
.pos { color: var(--green); } .neg { color: var(--red); }

/* Главное меню */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 28px; padding: 16px; box-sizing: border-box; overflow: auto; }
.title { text-align: center; }
.title h1 { margin: 0; font-size: clamp(30px, min(8.5vw, 15vh), 92px); letter-spacing: .1em; font-weight: 700; line-height: 1; position: relative; text-shadow: 0 0 30px rgba(138, 92, 255, .8), 0 0 80px rgba(138, 92, 255, .4); padding-left: .1em; }
.title h1 span { color: var(--cyan); text-shadow: 0 0 30px rgba(56, 214, 255, .8), 0 0 80px rgba(56, 214, 255, .35); }
.title h1::before, .title h1::after { content: attr(data-t); position: absolute; left: 0; top: 0; width: 100%; opacity: .0; pointer-events: none; }
.title h1::before { color: var(--pink); animation: glitch1 6s infinite steps(1); }
.title h1::after { color: var(--cyan); animation: glitch2 6s infinite steps(1); }
@keyframes glitch1 { 0%, 92%, 100% { opacity: 0; transform: none; } 93% { opacity: .8; transform: translate(-6px, 2px); clip-path: inset(10% 0 60% 0); } 95% { opacity: .8; transform: translate(5px, -2px); clip-path: inset(55% 0 12% 0); } 97% { opacity: 0; } }
@keyframes glitch2 { 0%, 90%, 100% { opacity: 0; transform: none; } 91% { opacity: .7; transform: translate(6px, -1px); clip-path: inset(45% 0 30% 0); } 94% { opacity: .7; transform: translate(-5px, 2px); clip-path: inset(5% 0 75% 0); } 96% { opacity: 0; } }
.title p { margin: 14px 0 0; letter-spacing: .38em; font-size: clamp(10px, 1.6vw, 14px); color: var(--dim); text-transform: uppercase; }
.mainnav { display: flex; flex-direction: column; gap: 10px; width: min(340px, 90vw); }
.mainnav .btn { padding: 13px 18px; font-size: 15px; letter-spacing: .2em; }
.menu-foot { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .12em; color: var(--mute); text-transform: uppercase; }
.menu-foot b { color: var(--dim); font-family: var(--mono); font-weight: 400; }
.corner-btn { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }

/* Карточки */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.card { background: var(--panel2); border: 1px solid var(--line); padding: 12px 14px; cursor: pointer; clip-path: var(--cut); display: flex; flex-direction: column; gap: 6px; transition: border-color .12s, transform .12s, background .12s; text-align: left; color: inherit; font-family: inherit; position: relative; }
.card:hover:not(.lock) { border-color: var(--cyan); transform: translateY(-2px); background: rgba(40, 32, 80, .95); }
.card.lock { opacity: .55; cursor: default; }
.card.sel { border-color: var(--cyan); box-shadow: inset 0 0 20px rgba(56, 214, 255, .15); }
.card h4 { margin: 0; font-size: 16px; letter-spacing: .06em; } .card p { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.35; }
.card .tag { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; }
.card .num { position: absolute; right: 10px; top: 8px; font: 700 12px var(--mono); color: var(--mute); }

/* Инвентарь */
.inv { display: grid; grid-template-columns: 200px 1fr 300px; gap: 16px; min-height: 0; }
.eq { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }

<script>

/* ---- 01_core.js ---- */
/* ============================================================
   SHADOW PROTOCOL — ядро: утилиты, сохранение, звук
   ============================================================ */
'use strict';
const TILE = 48, RW = 17, RH = 13, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const fmt = n => Math.round(n).toLocaleString('ru-RU');
const fmt1 = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// Детерминированный генератор для зон/лута (ежедневные испытания)
const R = { f: Math.random };
const rf = () => R.f();
const rfi = (a, b) => Math.floor(a + rf() * (b - a + 1));
const rfpick = arr => arr[Math.floor(rf() * arr.length)];
function shuffle(arr, f = rf) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

/* ---------------- Хранилище ---------------- */
const SAVE_KEY = 'shadow_protocol_save_v1';
const Store = {
  mem: {},
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (this.mem[k] || null); } catch (e) { return this.mem[k] || null; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* хранилище недоступно */ } },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(k); } catch (e) { } }
};
function defaultMeta() {
  return {
    v: 1, shards: 0, upg: {},
    stats: { runs: 0, deaths: 0, wins: 0, kills: 0, bosses: 0, playtime: 0, bestScore: 0, bestZone: 0, bestLevel: 0, maxShadow: 0, items: 0, chests: 0, events: 0 },
    endings: {}, notes: {}, history: [], daily: {},
    settings: { vol: 0.8, music: 0.55, sfx: 0.9, shake: 1, dmgNum: true, touch: 'auto', autoAim: true, calm: false, autoScrap: true, hints: true },
    tutorialDone: false, runSave: null
  };
}
let META = defaultMeta();
function loadMeta() {
  const s = Store.get(SAVE_KEY);
  const d = defaultMeta();
  if (s && typeof s === 'object') {
    META = Object.assign(d, s);
    META.stats = Object.assign(d.stats, s.stats || {});
    META.settings = Object.assign(d.settings, s.settings || {});
    META.upg = s.upg || {}; META.endings = s.endings || {}; META.notes = s.notes || {};
    META.history = Array.isArray(s.history) ? s.history : []; META.daily = s.daily || {};
  } else META = d;
  return META;
}
function saveMeta() { Store.set(SAVE_KEY, META); }

/* ---------------- Звук (синтез через WebAudio) ---------------- */
const Aud = {
  ctx: null, master: null, sfxG: null, musG: null, last: {}, noiseBuf: null, drone: null, beatT: 0, step: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.sfxG = c.createGain(); this.musG = c.createGain();
      this.sfxG.connect(this.master); this.musG.connect(this.master); this.master.connect(c.destination);
      const len = c.sampleRate; const b = c.createBuffer(1, len, c.sampleRate); const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b; this.applyVol(); this.startDrone();
    } catch (e) { this.ctx = null; }
  },
  applyVol() {
    if (!this.ctx) return; const s = META.settings;
    this.master.gain.value = s.vol; this.sfxG.gain.value = s.sfx; this.musG.gain.value = s.music * 0.9;
  },
  tone(f, dur, type = 'sine', vol = 0.2, slide = null, delay = 0, dest = null) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, ftype = 'lowpass', f1 = 1500, f2 = null, delay = 0) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const fl = c.createBiquadFilter(); fl.type = ftype; fl.frequency.setValueAtTime(f1, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.sfxG); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  sfx(n, v = 1) {
    if (!this.ctx) return;
    const now = performance.now(); const gap = (n === 'hit' || n === 'xp') ? 35 : 20;
    if (this.last[n] && now - this.last[n] < gap) return; this.last[n] = now;
    const T = (f, d, ty, vo, sl, de) => this.tone(f, d, ty, vo * v, sl, de);
    switch (n) {
      case 'hit': this.noise(0.07, 0.22 * v, 'lowpass', 2400, 400); T(190, 0.08, 'square', 0.09, 80); break;
      case 'crit': this.noise(0.1, 0.25 * v, 'highpass', 1500, 4000); T(720, 0.12, 'square', 0.1, 180); T(1400, 0.06, 'triangle', 0.08, 700); break;
      case 'swing': this.noise(0.11, 0.14 * v, 'bandpass', 900, 2600); break;
      case 'heavy': this.noise(0.22, 0.25 * v, 'lowpass', 900, 120); T(90, 0.22, 'sawtooth', 0.13, 40); break;
      case 'shoot': T(980, 0.1, 'sawtooth', 0.07, 220); this.noise(0.05, 0.08 * v, 'highpass', 3000); break;
      case 'shotgun': this.noise(0.2, 0.28 * v, 'lowpass', 3000, 300); T(120, 0.16, 'square', 0.12, 45); break;

      case 'die': T(220, 1.2, 'sawtooth', 0.18, 30); this.noise(1.0, 0.25 * v, 'lowpass', 900, 60); break;
      case 'boom': this.noise(0.55, 0.4 * v, 'lowpass', 700, 60); T(70, 0.4, 'sine', 0.25, 30); break;
      case 'ui': T(520, 0.05, 'triangle', 0.07); break;

      case 'qa': T(180, 0.3, 'sawtooth', 0.12, 60); this.noise(0.3, 0.16 * v, 'bandpass', 500, 120); break;
      case 'ea': T(900, 0.3, 'sine', 0.12, 300); T(1300, 0.22, 'triangle', 0.08, 500, 0.04); break;
      case 'heal': T(520, 0.25, 'sine', 0.1, 780); T(780, 0.3, 'sine', 0.09, 1170, 0.1); break;

      case 'break': this.noise(0.22, 0.22 * v, 'lowpass', 1800, 300); T(140, 0.15, 'square', 0.06, 70); break;

  startDrone() {
    const c = this.ctx; if (!c || this.drone) return;
    const o1 = c.createOscillator(), o2 = c.createOscillator(), o3 = c.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'sawtooth'; o3.type = 'sine';
    o1.frequency.value = 55; o2.frequency.value = 55.7; o3.frequency.value = 27.5;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 240; f.Q.value = 2;
    const g = c.createGain(); g.gain.value = 0.2;
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 110;
    lfo.connect(lg); lg.connect(f.frequency);
    o1.connect(f); o2.connect(f); o3.connect(g); f.connect(g); g.connect(this.musG);
    o1.start(); o2.start(); o3.start(); lfo.start();
    this.drone = { o1, o2, o3, f, g };
  },
  musicTick(dt, tension, night) {
    if (!this.ctx || !this.drone) return;
    const d = this.drone, t = this.ctx.currentTime;
    const base = night > 0.5 ? 49 : 55;
    d.o1.frequency.setTargetAtTime(base, t, 0.8); d.o2.frequency.setTargetAtTime(base * 1.013, t, 0.8); d.o3.frequency.setTargetAtTime(base / 2, t, 0.8);
    d.f.frequency.setTargetAtTime(220 + tension * 420 + night * 60, t, 0.5);
    this.beatT -= dt;
    if (this.beatT <= 0) {
      this.beatT = tension > 0.4 ? 0.28 : 0.55;
      const sc = night > 0.5 ? [0, 1, 5, 7, 8, 12] : [0, 3, 5, 7, 10, 12];
      this.step = (this.step + 1) % 8;
      if (this.step % 2 === 0 || tension > 0.5) {
        const n = sc[Math.floor(Math.random() * sc.length)];
        const f = base * 4 * Math.pow(2, n / 12);
        this.tone(f, 0.5, 'triangle', 0.035 + tension * 0.03, f * 0.98, 0, this.musG);
      }
      if (tension > 0.3 && this.step % 4 === 0) this.tone(base, 0.18, 'sine', 0.12, base * 0.5, 0, this.musG);
    }
  }
};

function rollRarity(bonus = 0, minR = 0) {
  const L = 1 + bonus;
  const ws = RARITY.map((r, i) => i === 0 ? r.w / L : r.w * (i === 1 ? 1 + bonus * 0.4 : L * (1 + i * 0.12)));
  let tot = 0; ws.forEach(w => tot += w);
  let x = rf() * tot, rar = 0;
  for (let i = 0; i < ws.length; i++) { x -= ws[i]; if (x <= 0) { rar = i; break; } }
  return Math.max(rar, minR);
}
function affixRoll(a, rar, il) {
  const t = rf();
  const s = (0.55 + rar * 0.12) * (1 + (il - 1) * 0.045);
  let v = a.lo + (a.hi - a.lo) * Math.min(1, t * 0.6 + 0.4 * rf() * s);
  v *= (0.82 + rar * 0.1 + il * 0.02);

}

}
function makeItem(kind, opts = {}) {

}

/* Эффективные характеристики оружия */
function weaponStats(it) {
  if (!it || it.kind !== 'weapon') return null;
  if (it._c && it._cl === it.lvl) return it._c;
  const b = WEAPONS[it.base];
  const mult = RARITY[it.rar].mult * (1 + 0.08 * it.lvl) * (1 + 0.11 * (it.il - 1));
  const s = {
    base: it.base, cls: b.cls, type: b.type, fx: it.fx, name: it.name, melee: b.cls === 'melee',
    dmg: b.dmg * mult, rate: b.rate, range: b.range || 0, arc: b.arc || 0, kb: b.kb || 0, combo: b.combo || 1, stam: b.stam || 0,
    speed: b.speed || 0, en: b.en || 0, spread: b.spread || 0, pellets: b.pellets || 1, life: b.life || 0.9, pierce: b.pierce || 0, chain: b.chain || 0,
    crit: 0.05, critD: 1.0, leech: b.leech || 0, shock: 0, poison: 0, exec: 0, dark: 0
  };
  it.aff.forEach(a => {
    const v = a.v;
    switch (a.k) {
      case 'wDmg': s.dmg *= 1 + v / 100; break;
      case 'wAs': s.rate *= 1 + v / 100; break;
      case 'wCrit': s.crit += v / 100; break;
      case 'wCritD': s.critD += v / 100; break;
      case 'wLeech': s.leech += v / 100; break;
      case 'wShock': s.shock += v / 100; break;
      case 'wPoison': s.poison += v; break;
      case 'wPierce': s.pierce += v; break;
      case 'wKb': s.kb *= 1 + v / 100; break;
      case 'wExec': s.exec += v / 100; break;
      case 'wDark': s.dmg *= 1 + v / 100; s.dark = v; break;

  });
  if (it.fx === 'net') s.chain = 6;
  if (it.fx === 'bouncy') s.bounce = 2;

}

/* ============ Пересчёт характеристик игрока ============ */
function recalc() {
  if (!RUN || !P) return;
  const M = {}; MOD_KEYS.forEach(k => M[k] = 0);
  const add = (src, mul = 1) => { for (const k in src) { if (M[k] === undefined) M[k] = 0; M[k] += src[k] * mul; } };
  for (const id in P.perks) { const p = PERK_BY[id]; if (p) add(p.m, P.perks[id]); }
  for (const id in P.skills) { const n = TREE_NODE[id]; if (n) add(n.m, P.skills[id]); }
  const eq = RUN.equip;
  let armBase = 0, hpBase = 0, spdBase = 0, stamBase = 0;
  if (eq.armor) {
    const a = armorStats(eq.armor); armBase += a.arm; hpBase += a.hp; spdBase += a.spd; stamBase += a.stam;
    eq.armor.aff.forEach(f => applyAffixMod(M, f));
  }
  if (eq.mod) {
    const b = MODULES[eq.mod.base].base; applyAffixMod(M, { k: b.k, v: moduleBaseVal(eq.mod) });
    eq.mod.aff.forEach(f => applyAffixMod(M, f));
  }
  const meta = META.upg;
  M.hp += (meta.hp || 0) * 8; M.en += (meta.en || 0) * 10; M.luck += (meta.luck || 0) * 0.05; M.xp += (meta.xp || 0) * 0.06;
  M.shadowRes += (meta.shade || 0) * 0.08;
  const fx = (eq.armor && eq.armor.fx) || null, fxm = (eq.mod && eq.mod.fx) || null;
  P.fxArmor = fx; P.fxMod = fxm;
  if (fxm === 'shard') { /* откат уже в аффиксах */ }
  if (P.zoneBuff) { M.armor += P.zoneBuff.armor || 0; M.allDmg += P.zoneBuff.dmg || 0; }
  if (RUN.mods.glass) { M.allDmg += 0.6; }
  if (RUN.mods.haste) M.spd += 0.1;
  if (RUN.mods.dark) M.darkPow += 0.4;
  P.mods = M;
  P.armor = armBase + M.armor;
  let hpMul = 1 - P.shadow * 0.0025;
  if (M.bloodpact) hpMul *= 0.85;
  if (RUN.mods.glass) hpMul *= 0.55;
  const oldMax = P.maxHp;
  P.maxHp = Math.max(30, Math.round((100 + hpBase + M.hp) * hpMul));
  if (oldMax && P.maxHp > oldMax && P.hp > 0 && !P._noHeal) { /* максимум вырос — подлечим на прирост */ P.hp = Math.min(P.maxHp, P.hp + (P.maxHp - oldMax)); }
  P.hp = Math.min(P.hp, P.maxHp);
  P.maxStam = 100 + stamBase + M.stam;
  P.maxEn = 60 + M.en;
  P.stam = Math.min(P.stam, P.maxStam); P.en = Math.min(P.en, P.maxEn);
  P.speed = 196 * (1 + spdBase + M.spd);
  P.stamRegen = 34 * (1 + M.stamRegen);
  P.enRegen = 4.2 * (1 + M.enRegen);
  P.dashCost = 26 * (1 - Math.min(0.7, M.dashCost));
  P.cdrMul = Math.max(0.3, 1 - M.cdr);
  P.magnetR = 70 * (1 + M.magnet);
  P.xpMul = 1 + M.xp;
  P.luckB = M.luck;
  P.resMul = 1 + M.res;
  P.shadowMul = Math.max(0.2, 1 - M.shadowRes) * (fx === 'aegis' ? 0.7 : 1);
  P.healMul = 1 + M.healPow;
  P.regenR = M.regen;
  P.invCap = 24 + (meta.inv || 0) * 4;
}

const PCT_KEYS = { spd: 1, stamRegen: 1, enRegen: 1, dashCost: 1, magnet: 1, xp: 1, luck: 1, res: 1, shadowRes: 1, darkPow: 1, allDmg: 1, crit: 1, leech: 1, cdr: 1 };

/* ============================================================

   ============================================================ */
const T_FLOOR = 0, T_WALL = 1, T_LOW = 2, T_DOOR = 3, T_CRACK = 4, T_HAZ = 5;
const DIRS = [{ n: 'N', dx: 0, dy: -1 }, { n: 'E', dx: 1, dy: 0 }, { n: 'S', dx: 0, dy: 1 }, { n: 'W', dx: -1, dy: 0 }];
const DOOR_POS = [[RW >> 1, 0], [RW - 1, RH >> 1], [RW >> 1, RH - 1], [0, RH >> 1]];
const GW = 5, GH = 4;
const ROOM_LABEL = { start: 'Укрытие', combat: 'Зачистка', boss: 'Логово', camp: 'Лагерь', treasure: 'Хранилище', event: 'Происшествие', secret: 'Тайник' };

function tileAt(room, tx, ty) { if (tx < 0 || ty < 0 || tx >= RW || ty >= RH) return T_WALL; return room.tiles[ty * RW + tx]; }
function doorIdxAt(room, tx, ty) {
  for (let d = 0; d < 4; d++) if (DOOR_POS[d][0] === tx && DOOR_POS[d][1] === ty) return d;
  return -1;
}
function doorBlocked(room, tx, ty) {
  const di = doorIdxAt(room, tx, ty); if (di < 0) return true;
  const d = room.doors[di]; if (!d) return true;
  return room.locked || d.gated || d.sealed;
}
// режим: 0 — наземный, 1 — снаряд, 2 — летающий
function solidTile(room, tx, ty, mode) {
  const t = tileAt(room, tx, ty);
  if (t === T_WALL || t === T_CRACK) return true;
  if (t === T_LOW) return mode === 0;
  if (t === T_DOOR) return doorBlocked(room, tx, ty);
  return false;
}

/* ---------------- Интерьеры ---------------- */

      if (hit && e.air) { }
    } else { moveEnt(e, e.kbx * dt, e.kby * dt, 0); }

/* ============================================================
   SHADOW PROTOCOL — системы: лут, взаимодействие, события, торговля,

/* ---------------- Лут ---------------- */
function safeSpot(x, y) {
  x = clamp(x, TILE * 1.5, (RW - 1.5) * TILE); y = clamp(y, TILE * 1.5, (RH - 1.5) * TILE);
  if (!solidTile(ROOM, Math.floor(x / TILE), Math.floor(y / TILE), 0)) return { x, y };
  for (let r = 1; r < 9; r++) for (let a = 0; a < 8; a++) {
    const nx = x + Math.cos(a * Math.PI / 4) * r * TILE * 0.6, ny = y + Math.sin(a * Math.PI / 4) * r * TILE * 0.6;
    if (nx > TILE * 1.3 && ny > TILE * 1.3 && nx < (RW - 1.3) * TILE && ny < (RH - 1.3) * TILE && !solidTile(ROOM, Math.floor(nx / TILE), Math.floor(ny / TILE), 0)) return { x: nx, y: ny };
  }
  return { x: P ? P.x : TILE * 3, y: P ? P.y : TILE * 3 };
}
function dropLoot(type, x, y, amt, o = {}) {
  if (type !== 'item' && !(amt > 0)) return;
  { const s = safeSpot(x, y); x = s.x; y = s.y; }
  const a = Math.random() * TAU, s = 50 + Math.random() * 110;
  W.loot.push({ type, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, amt, age: 0, bob: Math.random() * TAU, it: o.it });
}
function dropItemAt(it, x, y) {
  { const s = safeSpot(x, y); x = s.x; y = s.y; }
  W.loot.push({ type: 'item', x, y, vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160, it, age: 0, bob: Math.random() * TAU });
  if (it.rar >= 3) { Aud.sfx('legend'); ringFx(x, y, 60, itemColor(it), 0.6, 3); }
}
function itemLevel() { return RUN.zi + Math.floor(P.level / 5); }
function dropEnemyLoot(e) {
  const rm = rewardMul() * P.resMul * (RUN.mods.rich ? 1.6 : 1) * (e.elite ? 1.8 : 1);
  const zs = 1 + 0.25 * (RUN.zi - 1);
  if (Math.random() < 0.58) dropLoot('metal', e.x, e.y, Math.max(1, Math.round((1 + Math.random() * 2) * zs * rm)));
  if (Math.random() < 0.32) dropLoot('parts', e.x, e.y, Math.max(1, Math.round((1 + Math.random()) * zs * rm)));
  const cc = 0.035 + (e.elite ? 0.4 : 0) + nightF() * 0.04 + (e.def.xp > 18 ? 0.04 : 0);
  if (Math.random() < cc) dropLoot('crystal', e.x, e.y, 1);
  if (Math.random() < (RUN.mods.nomed ? 0.16 : 0.055)) dropLoot('hp', e.x, e.y, 0.12);
  if (Math.random() < 0.07) dropLoot('en', e.x, e.y, 22);
  const ic = 0.05 + (e.elite ? 0.55 : 0) + nightF() * 0.03 + (e.def.cost >= 4 ? 0.04 : 0);
  if (Math.random() < ic) {
    const kind = pick(['weapon', 'weapon', 'armor', 'module', 'chip', 'weapon', 'armor']);
    const it = makeItem(kind, { il: itemLevel(), luck: P.luckB + 0.3 * nightF() + (e.elite ? 0.4 : 0), minR: e.elite ? 1 : 0, dark: shadowTier() >= 2 && Math.random() < 0.12 });
    dropItemAt(it, e.x, e.y);
  }
}
function updateLoot(dt) {
  const arr = W.loot;
  for (let i = arr.length - 1; i >= 0; i--) {
    const l = arr[i]; l.age += dt;
    if (solidTile(ROOM, Math.floor(l.x / TILE), Math.floor(l.y / TILE), 0)) { const s2 = safeSpot(l.x, l.y); l.x = s2.x; l.y = s2.y; l.vx = l.vy = 0; }
    const ox = l.x, oy = l.y; l.x += l.vx * dt; l.y += l.vy * dt; const fr = Math.exp(-dt * 5); l.vx *= fr; l.vy *= fr;
    if (solidTile(ROOM, Math.floor(l.x / TILE), Math.floor(l.y / TILE), 0)) { l.x = ox; l.y = oy; l.vx = l.vy = 0; }
    const d = dist(l.x, l.y, P.x, P.y);
    if (P.hp <= 0) continue;
    if (l.type === 'xp') {
      if (l.age > 0.3) { const a = angTo(l.x, l.y, P.x, P.y); const sp = 260 + l.age * 500; l.x += Math.cos(a) * sp * dt; l.y += Math.sin(a) * sp * dt; l.vx = l.vy = 0; }
      if (d < 18) { addXp(l.amt); Aud.sfx('xp'); arr.splice(i, 1); }
      continue;
    }
    if (l.type === 'item') {
      if (d < 24 && l.age > 0.5) { if (pickItem(l)) arr.splice(i, 1); }
      continue;
    }
    if (d < P.magnetR && l.age > 0.35) { const a = angTo(l.x, l.y, P.x, P.y); const sp = 200 + (P.magnetR - d) * 6; l.x += Math.cos(a) * sp * dt; l.y += Math.sin(a) * sp * dt; }
    if (d < 20 && l.age > 0.3) {
      if (l.type === 'hp') { if (P.hp >= P.maxHp - 0.5) continue; healPlayer(P.maxHp * l.amt * P.healMul); Aud.sfx('heal'); }
      else if (l.type === 'en') { if (P.en >= P.maxEn - 0.5) continue; P.en = Math.min(P.maxEn, P.en + l.amt); Aud.sfx('pickup'); floatText(P.x, P.y - 22, '+' + l.amt, '#9a8aff', 12, 0.6); }
      else { const k = l.type === 'metal' ? 'metal' : l.type === 'parts' ? 'parts' : 'crystal'; RUN.res[k] += l.amt; Aud.sfx(l.type === 'crystal' ? 'gear' : 'coin'); floatText(P.x, P.y - 22, '+' + l.amt + ' ' + (k === 'metal' ? 'мет.' : k === 'parts' ? 'дет.' : 'крист.'), l.type === 'crystal' ? '#c8a8ff' : l.type === 'parts' ? '#ffd98a' : '#cfd8e8', 12, 0.7); }
      arr.splice(i, 1);
    }
  }
}
function pickItem(l) {
  const it = l.it;
  if (RUN.inv.length >= P.invCap) { if (G.t - (G.lastFull || 0) > 2) { G.lastFull = G.t; toast('Инвентарь полон — разберите лишнее (I)', '#ff8a8a'); Aud.sfx('err'); } return false; }
  META.stats.items++;
  if (META.settings.autoScrap && it.rar === 0 && !it.uid) { const sv = scrapValue(it); RUN.res.metal += sv.m; RUN.res.parts += sv.p; floatText(P.x, P.y - 22, `+${sv.m} мет.`, '#cfd8e8', 12, 0.7); Aud.sfx('coin'); return true; }
  RUN.inv.push(it);
  Aud.sfx(it.rar >= 4 ? 'legend' : it.rar >= 2 ? 'gear' : 'pickup');
  toast(`<span style="color:${itemColor(it)}">${esc(it.name)}</span> · ${RARITY[it.rar].name}`, '#fff');
  if (it.rar >= 3) { addFlash(0.12, itemColor(it)); }
  // авто-экипировка в пустые слоты
  const slot = it.kind === 'armor' ? 'armor' : it.kind === 'module' ? 'mod' : null;
  if (slot && !RUN.equip[slot]) { RUN.inv.pop(); RUN.equip[slot] = it; recalc(); toast('Экипировано автоматически', '#9ad8ff'); }
  if (RUN.tut) tutNote('loot');
  if (typeof uiRefreshInv === 'function') uiRefreshInv();
  return true;
}

/* ---------------- Взаимодействие ---------------- */
function findNearObj() {
  let best = null, bd = 9999;
  for (const o of ROOM.objs) {
    if (o.type === 'chest' && o.open) continue; if ((o.type === 'event' || o.type === 'note') && o.used) continue;
    const d = dist(P.x, P.y, o.x, o.y); if (d < o.r + 34 && d < bd) { bd = d; best = o; }
  }
  return best;
}
function objPrompt(o) {
  switch (o.type) {
    case 'chest': return 'Открыть сундук';
    case 'trader': return shadowTier() >= 4 ? 'Торговец прячется…' : 'Поговорить с торговцем';
    case 'bench': return 'Верстак: улучшение и создание';
    case 'bed': return o.uses > 0 ? 'Отдохнуть и сохранить прогресс' : 'Койка (уже использована)';

/* ---------------- Главный апдейт ---------------- */
function updateGame(dt) {
  G.t += dt; RUN.time += dt; RUN.clock += dt; META.stats.playtime += dt;
  // таймеры
  for (let i = W.timers.length - 1; i >= 0; i--) { const t = W.timers[i]; t.t -= dt; if (t.t <= 0) { W.timers.splice(i, 1); t.fn(); } }
  // день / ночь
  const nf = nightF(); const wasN = G.wasNight || 0;
  if (nf > 0.5 && wasN <= 0.5) { banner('НАСТУПАЕТ НОЧЬ', 'Враги опаснее, награды ценнее', '#8a7cff'); Aud.sfx('shadow'); }
  if (nf <= 0.5 && wasN > 0.5) { banner('РАССВЕТ', 'Ночь отступила', '#ffe08a'); }
  G.wasNight = nf;
  if (G.recalcQ) { G.recalcQ = false; recalc(); }
  // комната
  const room = ROOM;
  if (room.pending > 0) { room.pending -= dt; if (room.pending <= 0) { room.pending = 0; if (room.type === 'combat') startWave(room); else if (room.type === 'boss') { lockRoom(true); spawnBoss(Z.def.boss); } } }
  updatePlayer(dt);
  updateEnemies(dt);
  updateProjs(dt); updateTeles(dt); updateAreas(dt); updateBeams(dt); updateAllies(dt); updateLoot(dt);
  checkRoomClear(dt); updateHazards(dt);
  if (RUN.tut) updateTutorial(dt);
  // эффекты
  for (let i = W.parts.length - 1; i >= 0; i--) {
    const p = W.parts[i]; p.life -= dt; if (p.life <= 0) { W.parts.splice(i, 1); continue; }
    if (p.ring) continue; const dr = Math.exp(-(p.drag || 0) * dt); p.vx *= dr; p.vy *= dr; if (p.grav) p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = W.texts.length - 1; i >= 0; i--) { const t = W.texts[i]; t.life -= dt; if (t.life <= 0) { W.texts.splice(i, 1); continue; } t.y += t.vy * dt; t.vy *= 0.96; }
  for (let i = W.arcs.length - 1; i >= 0; i--) { W.arcs[i].t -= dt; if (W.arcs[i].t <= 0) W.arcs.splice(i, 1); }
  for (let i = W.slashes.length - 1; i >= 0; i--) { W.slashes[i].t -= dt; if (W.slashes[i].t <= 0) W.slashes.splice(i, 1); }
  if (Math.random() < dt * 12) dust(1);
  // рядом объект
  G.nearObj = findNearObj();
  G.shake = Math.max(0, G.shake - dt * 2.4); G.flash = Math.max(0, G.flash - dt * 2.2);
  if (G.subtitle) { G.subtitle.t -= dt; if (G.subtitle.t <= 0) G.subtitle = null; }
  if (P.pending > 0 && G.state === 'play' && !G.fadeCb) { openUI('levelup'); }
  // события завершения обучения/подсказки
  const T = shadowTier(); if (T !== (G.lastTier || 0)) G.lastTier = T;
}

/* ---------------- Смерть и итог забега ---------------- */
function calcScore(win) {
  return Math.round(RUN.score + RUN.zi * 300 + P.level * 60 + RUN.bosses * 400 + (win ? 3000 : 0) + Math.max(0, 600 - RUN.time / 4) * (win ? 1 : 0.2));
}
function endRun(win, ending) {
  const score = calcScore(win);
  const shards = Math.round(score / 45 + RUN.bosses * 25 + RUN.zi * 12 + (win ? 150 : 0) + (RUN.daily ? 40 : 0));
  META.shards += shards; const S = META.stats;
  if (win) { S.wins++; if (ending) META.endings[ending] = true; } else S.deaths++;
  S.bestScore = Math.max(S.bestScore, score); S.bestZone = Math.max(S.bestZone, RUN.zi); S.bestLevel = Math.max(S.bestLevel, P.level);
  const rec = { d: Date.now(), score, zone: RUN.zi, level: P.level, kills: RUN.kills, time: Math.round(RUN.time), win: !!win, ending: ending || null, lo: RUN.loadout, sh: Math.round(RUN.shadowMax), daily: RUN.daily ? RUN.dkey : null, by: win ? '' : RUN.deathCause };
  META.history.unshift(rec); META.history = META.history.slice(0, 40);
  if (RUN.daily) { const d = META.daily[RUN.dkey] || { best: 0, runs: 0, wins: 0 }; d.best = Math.max(d.best, score); d.runs++; if (win) d.wins++; META.daily[RUN.dkey] = d; }
  META.runSave = null; saveMeta();
  return { score, shards, rec };
}

function camZoom() {

  let pt = '', pk = false;
  if (G.gateHint && G.gateHint.t > 0) { G.gateHint.t -= dt; pt = `Энергозамок закрыт: зачистите комнаты (${Z.clearedCombat}/${Z.needed})`; }

}

function shadowEffects() {
  const t = shadowTier(), out = [];
  out.push(['Вы', `Урон +${(P.shadow * 0.5).toFixed(0)}%, максимум здоровья −${(P.shadow * 0.25).toFixed(0)}%` + (P.shadowMul < 1 ? `, Тень копится на ${Math.round((1 - P.shadowMul) * 100)}% медленнее` : '')]);
  if (t === 0) out.push(['Мир', 'Тьма спит. Люди видят в вас человека, торговцы улыбаются.']);
  if (t >= 1) { const mu = Object.values(MUTATIONS).filter(m => m.tier <= t).map(m => m.n).join(', '); out.push(['Враги', `Здоровье +${t * 10}%, урон +${t * 7}%. Мутации: ${mu}`]); }
  if (t >= 2) out.push(['Торговцы', t >= 4 ? 'Прячутся от вас — торговли нет' : `Цены ×${traderMarkup()}`]); else out.push(['Торговцы', 'Обычные цены']);
  if (t >= 3) out.push(['Охотники', 'Идут по вашему следу. После зачистки комнаты открываются прорывы тьмы']);
  if (t >= 2) out.push(['Люди', 'Выжившие боятся вас: события меняются, выбор тяжелее']);
  return out;
}
function endingHint() {

  if (P.shadow <= 40) ok.push('Рассвет'); if (P.shadow >= 50) ok.push('Король теней'); if (P.shadow >= 25 && P.shadow <= 75) ok.push('Последний страж'); if (nn >= 7) ok.push('Нулевой пациент');
  return `Записей найдено: <b>${nn}/${NOTES.length}</b>. При текущей Тени (${s}) финал будет: <b class="gold">${ok.join(', ') || '—'}</b>`;
}
function heroBody() {
  const m = P.mods; const st = [
    ['Здоровье', Math.ceil(P.hp) + ' / ' + P.maxHp], ['Броня', Math.round(P.armor) + ` (−${Math.round(P.armor / (P.armor + 90) * 100)}% урона)`], ['Скорость', Math.round(P.speed)], ['Выносливость', Math.round(P.maxStam)], ['Энергия', Math.round(P.maxEn)],
    ['Урон ближнего боя', '+' + Math.round((m.allDmg + m.meleeDmg + P.shadow * 0.005) * 100) + '%'], ['Урон дальнего боя', '+' + Math.round((m.allDmg + m.rangedDmg + P.shadow * 0.005) * 100) + '%'], ['Крит (бонус)', '+' + Math.round(m.crit * 100) + '%'], ['Вампиризм', Math.round(m.leech * 100) + '%'],
    ['Удача', '+' + Math.round(P.luckB * 100) + '%'], ['Опыт', '+' + Math.round((P.xpMul - 1) * 100) + '%'], ['Ресурсы', '+' + Math.round((P.resMul - 1) * 100) + '%']
  ].map(([k, v]) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  const t = shadowTier();

/* ============================ Клавиши в окнах ============================ */
function uiKey(e) {
  const k = e.code, n = UI.name; const dg = /^Digit([1-4])$/.exec(k);
  if (k === 'Escape') {
    if (['levelup', 'final', 'ending', 'death', 'menu'].includes(n)) return true;
    if (n === 'event') { ACT.evclose(); return true; }
    Aud.sfx('ui'); uiBack(); return true;
  }
  if (n === 'inv') {
    const m = { KeyI: 'inv', Tab: 'inv', KeyK: 'skills', KeyM: 'map', KeyH: 'hero' }[k];
    if (m) { if (UI.tab === m && !UI.back) closeUI(); else { UI.tab = m; renderUI(); } return true; }
  }
  if (n === 'levelup' && dg) { ACT.perk({ i: +dg[1] - 1 }); return true; }
  if (n === 'event' && dg) { if (G.event.result === null) ACT.evopt({ i: +dg[1] - 1 }); return true; }
  if (n === 'event' && G.event.result !== null && ['KeyF', 'Enter', 'Space'].includes(k)) { ACT.evclose(); return true; }
  if (n === 'note' && ['KeyF', 'Enter', 'Space'].includes(k)) { closeUI(); return true; }
  if (n === 'pause' && k === 'KeyP') { closeUI(); return true; }
  if (n === 'trade' || n === 'bench') { if (k === 'KeyF') { closeUI(); return true; } }
  return false;
}

/* ---------------- Финал ---------------- */
function endingAvail(k) {
  const s = Math.round(P.shadow), nn = Object.keys(META.notes).length;
  if (k === 'dawn') return s <= 40 ? true : `Нужна Тень не выше 40 (сейчас ${s})`;
  if (k === 'throne') return s >= 50 ? true : `Нужна Тень не ниже 50 (сейчас ${s})`;
  if (k === 'seal') return s >= 25 && s <= 75 ? true : `Нужна Тень от 25 до 75 (сейчас ${s})`;
  return nn >= 7 ? true : `Нужно найти 7 записей (найдено ${nn} из ${NOTES.length})`;
}

SCR.final = () => {
  const s = Math.round(P.shadow);
  const opts = Object.keys(ENDINGS).map(k => { const r = endingAvail(k), E = ENDINGS[k]; return `<button class="btn finalopt${r === true ? '' : ' dis'}" data-a="fend" data-k="${k}" style="border-color:${r === true ? E.col : 'var(--line)'}"><h4 style="color:${r === true ? E.col : 'var(--dim)'}">${E.n}</h4>${END_COND[k]}<small>${r === true ? E.sub : '<span class="neg">' + r + '</span>'}</small></button>`; }).join('');
  return `<div class="panel md" style="width:680px"><header><h2 style="color:#ff62d8">Ядро разомкнуто</h2><div class="sp">Тень ${s} · Человечность ${Math.round(RUN.humanity)}</div></header><div class="body"><p class="evtext">ПРОТОКОЛ замолчал. Перед вами — открытое ядро, и каждая тень в городе слушает, что вы сделаете. Все пути, которые вы выбирали, привели сюда. Какие двери открыты — решает то, кем вы стали.</p><div class="col">${opts}</div></div></div>`;
};
ACT.fend = d => { if (endingAvail(d.k) !== true) { Aud.sfx('err'); return; } finishRun(d.k); };
function finishRun(k) {
  RUN.ending = k; const first = !META.endings[k]; const prev = META.stats.bestScore;
  const res = endRun(true, k); res.first = first; res.newBest = res.score > prev; res.k = k;
  G.state = 'dead'; $('hud').hidden = true; uiTutorial(null); Aud.sfx('legend'); addFlash(0.8, ENDINGS[k].col); openUI('ending', res);
}
SCR.ending = res => {
  const E = ENDINGS[res.k]; const hu = RUN.humanity; const epi = hu >= 70 ? 'Люди запомнили вас добрым словом.' : hu <= 30 ? 'Люди запомнили вас страхом.' : 'Люди так и не решили, кем вас считать.';
  return `<div class="screen" style="background:radial-gradient(ellipse at 50% 30%,${E.col}33,#05040c 72%)"><div style="max-width:760px;width:100%"><div class="endtitle" style="color:${E.col}">${E.n}</div><div class="endsub">${E.sub}</div><p class="endtext">${E.text}</p><p class="endtext dim" style="font-size:14px">${epi}</p><div style="margin:14px 0">${runStatsHtml(res)}</div><div class="row" style="justify-content:center;gap:24px;flex-wrap:wrap;margin-bottom:14px">${res.first ? `<b style="color:${E.col}">Концовка открыта (${Object.keys(META.endings).length}/4)</b>` : '<span class="dim">Концовка уже была открыта</span>'}${res.newBest ? '<b class="gold">Новый рекорд!</b>' : ''}<span class="shard" style="display:flex;gap:6px;align-items:center"><span style="width:16px;height:16px;display:inline-block">${SHARD_ICO()}</span>+${res.shards} осколков</span></div><div class="row" style="justify-content:center"><button class="btn" data-a="tomenu">В меню</button><button class="btn pri" data-a="newafter">Новый забег</button></div></div></div>`;
};

/* ---- 13_main.js ---- */
/* ============================================================
   SHADOW PROTOCOL — ввод, главный цикл, фон меню, запуск
   ============================================================ */
const IN = { mx: 0, my: 0, aimA: 0, wx: 0, wy: 0, sx: 0, sy: 0, fire1: false, fire2: false, dash: false, q: false, e: false, med: false, cell: false, bomb: false, touchMode: false, touchSlot: 'w1', keys: {}, aimHold: false, autoTouch: false, lastTouch: -9999, lx: 0, ly: 0, ax: 0, ay: 0, amag: 0 };
IN.autoTouch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
function applyTouchMode() {
  const s = META.settings.touch; const tm = s === 'on' ? true : s === 'off' ? false : IN.autoTouch;
  IN.touchMode = tm; APPEL.classList.toggle('is-touch', tm);
  if (!tm) { IN.lx = IN.ly = IN.ax = IN.ay = IN.amag = 0; }
}

/* ---------------- Клавиатура ---------------- */
const GAME_KEYS = new Set(['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
window.addEventListener('keydown', e => {
  Aud.init(); const k = e.code;
  if (UI.name) { if (uiKey(e)) e.preventDefault(); else if (GAME_KEYS.has(k) && e.target === document.body) e.preventDefault(); return; }
  if (GAME_KEYS.has(k)) e.preventDefault();
  IN.keys[k] = true;
  if (G.state !== 'play' || e.repeat) return;
  switch (k) {
    case 'Space': IN.dash = true; break;
    case 'KeyQ': IN.q = true; break;
    case 'KeyE': IN.e = true; break;
    case 'KeyF': interact(); break;
    case 'Digit1': IN.med = true; break;
    case 'Digit2': IN.cell = true; break;
    case 'Digit3': IN.bomb = true; break;
    case 'KeyI': case 'Tab': UI.tab = 'inv'; tutNote('inv'); openUI('inv'); break;
    case 'KeyK': UI.tab = 'skills'; openUI('inv'); break;
    case 'KeyM': UI.tab = 'map'; openUI('inv'); break;
    case 'KeyH': UI.tab = 'hero'; openUI('inv'); break;
    case 'Escape': case 'KeyP': Aud.sfx('ui'); openUI('pause'); break;
  }
});
window.addEventListener('keyup', e => { IN.keys[e.code] = false; });
function releaseInput() { IN.keys = {}; IN.fire1 = IN.fire2 = false; IN.aimHold = false; IN.lx = IN.ly = IN.ax = IN.ay = IN.amag = 0; hideSticks(); }
window.addEventListener('blur', () => { releaseInput(); if (G.state === 'play') openUI('pause'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseInput(); if (G.state === 'play') openUI('pause'); } });

/* ---------------- Мышь ---------------- */
window.addEventListener('mousemove', e => { IN.sx = e.clientX; IN.sy = e.clientY; if (performance.now() - IN.lastTouch > 900 && META.settings.touch === 'auto' && IN.touchMode && (Math.abs(e.movementX) + Math.abs(e.movementY) > 2)) { IN.autoTouch = false; applyTouchMode(); } });
CV.addEventListener('mousedown', e => {
  Aud.init(); try { APPEL.focus(); } catch (er) { }
  if (G.state !== 'play' || performance.now() - IN.lastTouch < 700) return;
  if (e.button === 0) IN.fire1 = true; else if (e.button === 2) IN.fire2 = true; e.preventDefault();
});
window.addEventListener('mouseup', e => { if (e.button === 0) IN.fire1 = false; if (e.button === 2) IN.fire2 = false; });
APPEL.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- Сенсор ---------------- */
const TS = { l: null, r: null, btn: {} };
const STICK_R = 52;
function hideSticks() { ['stick-l', 'stick-r'].forEach(id => $(id).classList.remove('on')); TS.l = TS.r = null; }
function stickShow(id, x, y) { const el = $(id); el.style.left = (x - 65) + 'px'; el.style.top = (y - 65) + 'px'; el.classList.add('on'); el.querySelector('i').style.transform = 'translate(0,0)'; }
function stickMove(id, dx, dy) { $(id).querySelector('i').style.transform = `translate(${dx}px,${dy}px)`; }
function touchBlocked(t) { return !!(t.target && t.target.closest && t.target.closest('.hbtn,#hud-cons,#prompt,#tut,#minimap-wrap,#ui,.tbtn')); }
APPEL.addEventListener('touchstart', e => {
  IN.lastTouch = performance.now(); Aud.init();
  if (META.settings.touch === 'auto' && !IN.touchMode) { IN.autoTouch = true; applyTouchMode(); }
  if (!IN.touchMode || G.state !== 'play') return;
  for (const t of e.changedTouches) {
    const b = t.target.closest && t.target.closest('.tbtn');
    if (b) { e.preventDefault(); touchBtn(b, true, t.identifier); continue; }
    if (touchBlocked(t)) continue; e.preventDefault();
    if (t.clientX < G.view.w * 0.5) { if (!TS.l) { TS.l = { id: t.identifier, x: t.clientX, y: t.clientY }; stickShow('stick-l', t.clientX, t.clientY); } }
    else if (!TS.r) { TS.r = { id: t.identifier, x: t.clientX, y: t.clientY }; stickShow('stick-r', t.clientX, t.clientY); IN.aimHold = true; }
  }
}, { passive: false });
APPEL.addEventListener('touchmove', e => {
  IN.lastTouch = performance.now(); if (!IN.touchMode) return;
  for (const t of e.changedTouches) {
    const upd = (s, id) => { let dx = t.clientX - s.x, dy = t.clientY - s.y; const l = Math.hypot(dx, dy); if (l > STICK_R) { dx *= STICK_R / l; dy *= STICK_R / l; } stickMove(id, dx, dy); return [dx / STICK_R, dy / STICK_R]; };
    if (TS.l && TS.l.id === t.identifier) { const [x, y] = upd(TS.l, 'stick-l'); const m = Math.hypot(x, y); if (m < 0.14) { IN.lx = IN.ly = 0; } else { IN.lx = x; IN.ly = y; } e.preventDefault(); }
    if (TS.r && TS.r.id === t.identifier) { const [x, y] = upd(TS.r, 'stick-r'); IN.amag = Math.hypot(x, y); if (IN.amag > 0.2) { IN.ax = x; IN.ay = y; } e.preventDefault(); }
  }
}, { passive: false });
function touchEnd(e) {
  IN.lastTouch = performance.now();
  for (const t of e.changedTouches) {
    if (TS.l && TS.l.id === t.identifier) { TS.l = null; IN.lx = IN.ly = 0; $('stick-l').classList.remove('on'); }
    if (TS.r && TS.r.id === t.identifier) { TS.r = null; IN.amag = 0; IN.aimHold = false; $('stick-r').classList.remove('on'); }
    Object.keys(TS.btn).forEach(k => { if (TS.btn[k] === t.identifier) { delete TS.btn[k]; const el = document.querySelector(`.tbtn[data-k="${k}"]`); if (el) el.classList.remove('on'); } });
  }
}
APPEL.addEventListener('touchend', touchEnd); APPEL.addEventListener('touchcancel', touchEnd);
function touchBtn(b, down, id) {
  const k = b.dataset.k; if (!down) return; b.classList.add('on'); TS.btn[k] = id; Aud.sfx('ui');
  if (k === 'dash') IN.dash = true; else if (k === 'q') IN.q = true; else if (k === 'e') IN.e = true; else if (k === 'use') interact();
  else if (k === 'alt') { IN.touchSlot = IN.touchSlot === 'w1' ? 'w2' : 'w1'; const el = $('tb-alt'); el._it = null; }
}

/* ---------------- Обновление ввода каждый кадр ---------------- */
function nearestEnemy(a, maxD, maxDiff) {
  let best = null, bd = 1e9;
  for (const e of W.enemies) {
    if (e.dead || e.spawnT > 0 || e.ghost > 0 || e.def.static && e.def.ai === 'pylon' && false) continue;
    const d = dist(P.x, P.y, e.x, e.y); if (d > maxD || d >= bd) continue;
    if (maxDiff < 3 && Math.abs(angDiff(a, angTo(P.x, P.y, e.x, e.y))) > maxDiff) continue; bd = d; best = e;
  }
  return best;
}
function updateInput() {
  if (!P) return;
  let mx = 0, my = 0;
  const K = IN.keys; if (K.KeyA || K.ArrowLeft) mx -= 1; if (K.KeyD || K.ArrowRight) mx += 1; if (K.KeyW || K.ArrowUp) my -= 1; if (K.KeyS || K.ArrowDown) my += 1;
  if (IN.touchMode && (IN.lx || IN.ly)) { mx = IN.lx; my = IN.ly; }
  IN.mx = mx; IN.my = my;
  if (IN.touchMode) {
    let a = IN.aimA, d = 200; const holding = IN.aimHold && TS.r;
    if (holding && (IN.ax || IN.ay)) {
      a = Math.atan2(IN.ay, IN.ax); d = 60 + clamp(IN.amag, 0, 1) * 260;
      if (META.settings.autoAim) { const t = nearestEnemy(a, 440, 0.55); if (t) { a = angTo(P.x, P.y, t.x, t.y); d = dist(P.x, P.y, t.x, t.y); } }
    } else {
      const t = META.settings.autoAim ? nearestEnemy(a, 420, 9) : null;
      if (t) { a = angTo(P.x, P.y, t.x, t.y); d = dist(P.x, P.y, t.x, t.y); }
      else if (mx || my) a = Math.atan2(my, mx);
    }
    IN.aimA = a; IN.wx = P.x + Math.cos(a) * d; IN.wy = P.y + Math.sin(a) * d;
    const fire = !!(holding && IN.amag > 0.25); IN.fire1 = fire && IN.touchSlot === 'w1'; IN.fire2 = fire && IN.touchSlot === 'w2';
  } else {
    const w = screenToWorld(IN.sx, IN.sy); IN.wx = w.x; IN.wy = w.y; IN.aimA = Math.atan2(w.y - P.y, w.x - P.x);
  }
}

/* ---------------- Фон главного меню ---------------- */
const MB = { t: 0, w: 0, h: 0, far: null, near: null, parts: null };
function menuBgInit() {
  const w = G.view.w, h = G.view.h; MB.w = w; MB.h = h; const rng = mulberry32(777);
  const layer = (hMin, hMax, wMin, wMax, density) => { const out = []; let x = -30; while (x < w + 60) { const bw = wMin + rng() * (wMax - wMin), bh = h * (hMin + rng() * (hMax - hMin)); const n = Math.floor(bw * bh / density); out.push({ x, w: bw, h: bh, win: Array.from({ length: n }, () => ({ x: rng(), y: rng(), c: rng() < 0.55 ? '#38d6ff' : '#b46cff', p: rng() * 6, s: 0.4 + rng() })) }); x += bw + rng() * 8; } return out; };
  MB.far = layer(0.2, 0.52, 40, 110, 5200); MB.near = layer(0.1, 0.32, 60, 150, 4200);
  MB.parts = Array.from({ length: 80 }, () => ({ x: rng() * w, y: rng() * h, v: 8 + rng() * 26, r: 0.6 + rng() * 1.8, c: rng() < 0.5 ? '#b46cff' : '#38d6ff', p: rng() * 6 }));
}
function drawMenuBg(dt) {
  const w = G.view.w, h = G.view.h, dpr = G.view.dpr, c = CTX; if (MB.w !== w || MB.h !== h || !MB.far) menuBgInit(); MB.t += dt; const t = MB.t;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0a0620'); g.addColorStop(0.6, '#140a2e'); g.addColorStop(1, '#06040f'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'lighter';
  glow(c, w * 0.5, h * 0.3, Math.min(w, h) * (0.62 + Math.sin(t * 0.6) * 0.03), '#8a5cff', 0.36);
  glow(c, w * 0.18, h * 0.62, Math.min(w, h) * 0.45, '#38d6ff', 0.12); glow(c, w * 0.86, h * 0.5, Math.min(w, h) * 0.5, '#ff4fd8', 0.1);
  c.globalCompositeOperation = 'source-over';
  const drawLayer = (L, col, off, par) => { L.forEach(b => { const x = b.x + off * par; c.fillStyle = col; c.fillRect(x, h - b.h, b.w, b.h); b.win.forEach(wd => { const a = 0.35 + 0.65 * Math.max(0, Math.sin(t * wd.s + wd.p)); if (a < 0.45) return; c.fillStyle = wd.c; c.globalAlpha = a * 0.55; c.fillRect(x + 4 + wd.x * (b.w - 10), h - b.h + 6 + wd.y * (b.h - 12), 2.4, 3.2); }); c.globalAlpha = 1; }); };
  const off = Math.sin(t * 0.08) * 14; drawLayer(MB.far, '#0d0a22', off, 0.5); drawLayer(MB.near, '#07050f', off, 1);
  c.globalCompositeOperation = 'lighter';
  MB.parts.forEach(p => { p.y -= p.v * dt; p.x += Math.sin(t * 0.5 + p.p) * 6 * dt; if (p.y < -4) { p.y = h + 4; p.x = Math.random() * w; } c.fillStyle = p.c; c.globalAlpha = 0.25 + 0.25 * Math.sin(t * 1.3 + p.p); c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill(); });
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  const fg = c.createLinearGradient(0, h * 0.7, 0, h); fg.addColorStop(0, 'rgba(138,92,255,0)'); fg.addColorStop(1, 'rgba(138,92,255,0.12)'); c.fillStyle = fg; c.fillRect(0, h * 0.7, w, h * 0.3);
  if (!VIGN || VIGN_W !== w || VIGN_H !== h) { c.setTransform(dpr, 0, 0, dpr, 0, 0); }
  const vg = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.78); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)'); c.fillStyle = vg; c.fillRect(0, 0, w, h);
}

/* ---------------- Главный цикл ---------------- */
let lastTs = 0, fpsAcc = 0, fpsN = 0;
function fxOnly(dt) {
  for (let i = W.parts.length - 1; i >= 0; i--) { const p = W.parts[i]; p.life -= dt; if (p.life <= 0) { W.parts.splice(i, 1); continue; } if (p.ring) continue; const dr = Math.exp(-(p.drag || 0) * dt); p.vx *= dr; p.vy *= dr; if (p.grav) p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  for (let i = W.texts.length - 1; i >= 0; i--) { const t = W.texts[i]; t.life -= dt; if (t.life <= 0) { W.texts.splice(i, 1); continue; } t.y += t.vy * dt; t.vy *= 0.96; }
}
function handleFade(dt) {
  if (G.fadeDir === 1) { G.fade += dt / 0.28; if (G.fade >= 1) { G.fade = 1; G.fadeDir = 0; const cb = G.fadeCb; G.fadeCb = null; if (cb) { cb(); if (P && ROOM) { updateCamera(0, true); } } } }
  else if (G.fadeDir === -1) { G.fade -= dt / 0.45; if (G.fade <= 0) { G.fade = 0; G.fadeDir = 0; } }
}
function tick(dt) {
  const st = G.state;
  if (st === 'menu') { const tv0 = $('touch').style; if (tv0.visibility !== 'hidden') tv0.visibility = 'hidden'; Aud.musicTick(dt, 0.05, 0.3); render(dt); drawMenuBg(dt); return; }
  if (!RUN || !P || !ROOM) return;
  handleFade(dt);
  if (st === 'play') {
    updateInput();
    if (G.hitstop > 0) { G.hitstop -= dt; }
    else {
      const steps = Math.max(1, Math.ceil(dt / 0.02)); const sd = dt / steps;
      for (let i = 0; i < steps && G.state === 'play'; i++) updateGame(sd);
    }
    updateCamera(dt, false);
    const act = W.enemies.reduce((n, e) => n + (e.dead ? 0 : 1), 0);
    Aud.musicTick(dt, clamp(act / 9 + (ROOM.locked ? 0.25 : 0) + (G.bossBar ? 0.5 : 0), 0, 1), nightF());
  } else if (st === 'dying') {
    G.dyingT -= dt; fxOnly(dt); G.shake = Math.max(0, G.shake - dt * 1.6); G.flash = Math.max(0, G.flash - dt * 2); P.hurtT = Math.max(0, P.hurtT - dt); G.t += dt; updateCamera(dt, false);
    if (G.dyingT <= 0) showDeath();
  } else {
    G.flash = Math.max(0, G.flash - dt * 2); G.shake = Math.max(0, G.shake - dt * 2);
  }
  if (st === 'play' || st === 'ui' || st === 'dying') hudUpdate(dt);
  render(dt);
  const showT = IN.touchMode && !$('hud').hidden && G.state === 'play'; const tv = $('touch').style; const want = showT ? 'visible' : 'hidden'; if (tv.visibility !== want) tv.visibility = want;
}
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts / 1000; let dt = now - lastTs; lastTs = now; if (!(dt > 0)) return; dt = Math.min(0.05, dt);
  try { tick(dt); } catch (err) { console.error(err); if (!frame.err) { frame.err = true; try { uiToast('Ошибка: ' + esc(err.message), '#ff4a6a'); } catch (e2) { } } }
}
window.addEventListener('resize', () => { resizeCanvas(); if (P && ROOM && G.state !== 'menu') updateCamera(0, true); });
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

/* ---------------- Запуск ---------------- */
function boot() {
  loadMeta(); resizeCanvas(); hudBuild(); applyTouchMode(); toMenu();
  window.__SP = { G, W, IN, get RUN() { return RUN; }, get P() { return P; }, get Z() { return Z; }, get ROOM() { return ROOM; }, META: () => META };
  requestAnimationFrame(t => { lastTs = t / 1000; requestAnimationFrame(frame); });
}
boot();
